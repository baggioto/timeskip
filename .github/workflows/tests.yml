name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Generate project
        run: brew install xcodegen && xcodegen generate
      # No Secrets.xcconfig in CI: unit tests never call the real TMDB API (ADR 0004).
      - name: Run unit tests
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+[^(]*' | head -1 | sed 's/ *$//')
          echo "Testing on $DEVICE"
          xcodebuild test -project Timeskip.xcodeproj -scheme Timeskip \
            -destination "platform=iOS Simulator,name=$DEVICE" \
            -only-testing:TimeskipTests \
            CODE_SIGNING_ALLOWED=NO -quiet
