name: Timeskip
options:
  bundleIdPrefix: com.baggioto
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Timeskip:
    type: application
    platform: iOS
    sources: [Timeskip]
    info:
      path: Timeskip/Info.plist
      properties:
        TMDBReadToken: $(TMDB_READ_TOKEN)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.Timeskip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeskip
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
  TimeskipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TimeskipTests]
    dependencies:
      - target: Timeskip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.TimeskipTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Timeskip:
    build:
      targets:
        Timeskip: all
        TimeskipTests: [test]
    test:
      targets: [TimeskipTests]
