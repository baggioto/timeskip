name: Timeskip
options:
  bundleIdPrefix: com.baggioto
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
packages:
  TimeskipKit:
    path: Packages/TimeskipKit
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Timeskip:
    type: application
    platform: iOS
    sources: [Timeskip]
    dependencies:
      - package: TimeskipKit
        product: TMDBKit
      - package: TimeskipKit
        product: DesignSystem
    info:
      path: Timeskip/Info.plist
      properties:
        TMDBReadToken: $(TMDB_READ_TOKEN)
        CFBundleURLTypes:
          - CFBundleURLName: com.baggioto.Timeskip
            CFBundleURLSchemes: [timeskip]
        CFBundleLocalizations: [en, pt-BR]
        CFBundleDevelopmentRegion: en
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.Timeskip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Timeskip
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
  TimeskipTests:
    type: bundle.unit-test
    platform: iOS
    sources: [TimeskipTests]
    dependencies:
      - target: Timeskip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.TimeskipTests
        GENERATE_INFOPLIST_FILE: YES
  TimeskipUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [TimeskipUITests]
    dependencies:
      - target: Timeskip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baggioto.TimeskipUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Timeskip
schemes:
  Timeskip:
    build:
      targets:
        Timeskip: all
        TimeskipTests: [test]
        TimeskipUITests: [test]
    test:
      targets: [TimeskipTests, TimeskipUITests]
